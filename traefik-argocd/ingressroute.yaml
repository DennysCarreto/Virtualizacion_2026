apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-ingressroute
  namespace: argocd-dryca
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`argocd.dryca.local`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80