apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-backend
  namespace: parcial-dryca
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: nginx
        image: nginx:1.24-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1-backend-service
  namespace: parcial-dryca
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 80