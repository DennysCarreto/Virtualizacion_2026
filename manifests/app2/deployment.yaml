apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-frontend
  namespace: parcial-dryca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: httpd
        image: httpd:2.4-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app2-frontend-service
  namespace: parcial-dryca
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80