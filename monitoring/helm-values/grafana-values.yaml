adminPassword: "admin" # Cambiar según preferencia

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring-dryca.svc.cluster.local:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.monitoring-dryca.svc.cluster.local:3100
        access: proxy
        isDefault: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    cluster-metrics:
      json: |
        {
          "annotations": { "list": [] },
          "editable": true,
          "title": "Clúster - Métricas Generales",
          "panels": [
            {
              "title": "Uso de CPU por Pod (parcial-dryca)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "targets": [
                {
                  "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"parcial-dryca\"}[2m])) by (pod)",
                  "legendFormat": "{{pod}}"
                }
              ]
            },
            {
              "title": "Uso de Memoria por Pod (parcial-dryca)",
              "type": "timeseries",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "targets": [
                {
                  "expr": "sum(container_memory_working_set_bytes{namespace=\"parcial-dryca\"}) by (pod)",
                  "legendFormat": "{{pod}}"
                }
              ]
            },
            {
              "title": "Estado de Pods (Running)",
              "type": "stat",
              "gridPos": { "h": 4, "w": 24, "x": 0, "y": 8 },
              "targets": [
                {
                  "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
                  "legendFormat": "Pods en Ejecución"
                }
              ]
            }
          ],
          "schemaVersion": 38,
          "version": 1
        }
    apps-logs:
      json: |
        {
          "annotations": { "list": [] },
          "editable": true,
          "title": "Logs de Aplicaciones (Loki)",
          "panels": [
            {
              "title": "Logs en Vivo - Namespace parcial-dryca",
              "type": "logs",
              "gridPos": { "h": 14, "w": 24, "x": 0, "y": 0 },
              "targets": [
                {
                  "expr": "{namespace=\"parcial-dryca\"}",
                  "datasource": { "type": "loki", "uid": "Loki" }
                }
              ]
            }
          ],
          "schemaVersion": 38,
          "version": 1
        }